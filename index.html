<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-base: #f4f4f4;
            --card-ink: #1a1a1a;
            --accent: #ff3e3e;
            --text-main: #f5f5f5;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
            perspective: 1200px;
        }

        #root {
            height: 100%;
            width: 100%;
        }

        .font-mono {
            font-family: 'Space Mono', monospace;
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 3D Card Transforms */
        .perspective-1000 {
            perspective: 1200px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .rotate-y-0 {
            transform: rotateY(0deg);
        }

        /* Animations */
        @keyframes dealSlide {
            0% {
                opacity: 0;
                transform: translateY(120%) scale(0.8) rotateX(45deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0);
            }
        }
        
        /* New Interface Entry Animations */
        @keyframes slideInFromTop {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes slideInFromBottom {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes zoomFadeIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-deal {
            animation: dealSlide 0.6s var(--ease-out-expo) backwards;
        }
        
        .animate-slide-in-top {
            animation: slideInFromTop 1.2s var(--ease-out-expo) backwards;
        }
        
        .animate-slide-in-bottom {
            animation: slideInFromBottom 1.2s var(--ease-out-expo) backwards;
        }
        
        .animate-zoom-fade-in {
            animation: zoomFadeIn 1.5s var(--ease-out-expo) backwards;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "matter-js": "https://esm.sh/matter-js@0.19.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
